{% extends "blog/base.html" %}

{% block content %}
<h1>Posts</h1>

<form method="get">
  <input type="text" name="q" placeholder="Search..." value="{{ query }}">
  <button type="submit">Search</button>
</form>

<hr>

{% for post in posts %}
  <h2>{{ post.title }}</h2>
  <p>{{ post.content }}</p>
  <p>Tags: {{ post.tags.all|join:", " }}</p>
  <hr>
{% empty %}
  <p>No results found.</p>
{% endfor %}
{% endblock %}
