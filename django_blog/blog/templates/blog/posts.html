{% extends "blog/base.html" %}

{% block content %}
  <h1>Posts</h1>

  {% for post in posts %}
    <article>
      <h2>{{ post.title }}</h2>
      <p>{{ post.content }}</p>
      <small>{{ post.created_at }}</small>
    </article>
    <hr />
  {% empty %}
    <p>No posts yet.</p>
  {% endfor %}
{% endblock %}
