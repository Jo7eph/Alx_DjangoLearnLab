{% extends "blog/base.html" %}

{% block title %}Blog Posts{% endblock %}

{% block content %}
<h2>Blog Posts</h2>

{% if posts %}
  <ul>
    {% for post in posts %}
      <li>
        <strong>{{ post.title }}</strong><br>
        <small>{{ post.published_date }}</small>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>No posts yet.</p>
{% endif %}
{% endblock %}
