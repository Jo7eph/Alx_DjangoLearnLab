<h2>Comments</h2>

{% for c in object.comments.all %}
  <p><strong>{{ c.author }}</strong>: {{ c.content }}</p>
  {% if user == c.author %}
    <a href="{% url 'comment-update' c.pk %}">Edit</a>
    <a href="{% url 'comment-delete' c.pk %}">Delete</a>
  {% endif %}
{% empty %}
  <p>No comments yet.</p>
{% endfor %}

{% if user.is_authenticated %}
  <a href="{% url 'comment-create' object.pk %}">Add comment</a>
{% else %}
  <p><a href="{% url 'login' %}">Login</a> to comment.</p>
{% endif %}
