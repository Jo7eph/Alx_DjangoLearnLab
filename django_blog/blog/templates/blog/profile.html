{% extends "blog/base.html" %}
{% load static %}

{% block title %}Profile{% endblock %}

{% block content %}
<h2>Your Profile</h2>

{% if messages %}
  {% for message in messages %}
    <p>{{ message }}</p>
  {% endfor %}
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save changes</button>
</form>

<p><a href="{% url 'logout' %}">Logout</a></p>
{% endblock %}
